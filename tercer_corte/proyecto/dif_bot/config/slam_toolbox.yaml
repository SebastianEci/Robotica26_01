slam_toolbox:
  ros__parameters:
    use_sim_time: true

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan

    mode: mapping

    resolution: 0.05
    max_laser_range: 8.0
    minimum_time_interval: 0.1
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    enable_interactive_mode: true
